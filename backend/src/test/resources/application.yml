spring:
  jackson:
    use-jackson2-defaults: true
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

api:
  security:
    enabled: false
    key: test-api-key
    header-name: X-API-Key

statusplattform:
  base-url: http://statusplattform.test
  sync:
    cron: "-"

slack:
  base-url: http://slack.test/api
  bot-token: ""
  channel-id: ""

openinghours:
  timezone: Europe/Oslo
