spring:
  jackson:
    use-jackson2-defaults: true
  application:
    name: openinghours
  main:
    banner-mode: "off"
    allow-bean-definition-overriding: true
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

api:
  security:
    key: ${API_KEY}
    header-name: X-API-Key

openinghours:
  timezone: ${OPENINGHOURS_TIMEZONE:Europe/Oslo}

statusplattform:
  base-url: ${STATUSPLATTFORM_URL:https://statusplattform-v2.intern.nav.no}
  sync:
    cron: ${STATUSPLATTFORM_SYNC_CRON:0 0 1 * * *}

slack:
  base-url: ${SLACK_API_URL:https://slack.com/api}
  bot-token: ${SLACK_BOT_TOKEN:}
  channel-id: ${SLACK_OPENINGHOURS_CHANNEL_ID:}
  downtime:
    channel-id: ${SLACK_DOWNTIME_CHANNEL_ID:}
    poll-cron: ${SLACK_DOWNTIME_POLL_CRON:0 */5 * * * *}
    lookback-hours: ${SLACK_DOWNTIME_LOOKBACK_HOURS:24}
    max-attempts: ${SLACK_DOWNTIME_MAX_ATTEMPTS:3}
    batch-size: ${SLACK_DOWNTIME_BATCH_SIZE:20}
    follow-up-window-hours: ${SLACK_DOWNTIME_FOLLOW_UP_WINDOW_HOURS:24}
    only-show-for-nav-employees: ${SLACK_DOWNTIME_ONLY_SHOW_FOR_NAV_EMPLOYEES:true}

azure-openai:
  endpoint: ${AZURE_OPENAI_ENDPOINT:}
  api-key: ${AZURE_OPENAI_API_KEY:}
  deployment: ${AZURE_OPENAI_DEPLOYMENT:}
  api-version: ${AZURE_OPENAI_API_VERSION:2024-10-21}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true
    operationsSorter: method
