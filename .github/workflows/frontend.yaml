name: Frontend

# Monorepo: bygger og deployer bare når frontend faktisk er endret.
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yaml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Push docker image to GAR
        uses: nais/docker-build-push@v0
        id: docker-build-push
        # docker-build-push er en composite action og arver ikke `defaults.run`,
        # så stiene under er relative til repo-roten.
        with:
          team: navdig
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          docker_context: frontend
          # Gir image-navnet «openinghours-frontend». Uten suffikset ville
          # frontend og backend skrevet til samme image i registeret.
          image_suffix: frontend
          # Nødvendig for at byggesteget skal få hentet Chainguard-basisimagene.
          pull: true
          cache_from: type=gha,scope=frontend
          cache_to: type=gha,mode=max,scope=frontend

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to prod-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: frontend/.nais/nais.yaml
          VAR: image=${{ needs.build.outputs.image }}
