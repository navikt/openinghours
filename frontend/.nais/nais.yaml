apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: openinghours-frontend
  namespace: navdig
  labels:
    team: navdig
spec:
  image: {{image}}
  port: 3000
  ingresses:
    - https://oppetidskalender.ansatt.nav.no
  liveness:
    path: /internal/health
    initialDelay: 10
  readiness:
    path: /internal/health
    initialDelay: 10
  replicas:
    min: 2
    max: 4
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
  # API_KEY til backend. Ligger kun i BFF-prosessen, aldri i klientbundelen.
  # Vi gjenbruker backendens egen secret med vilje: backend godtar nøyaktig én
  # gyldig nøkkel (streng-sammenligning i ApiKeyAuthenticationFilter), så en egen
  # frontend-secret måtte uansett hatt identisk verdi og kunne kommet ut av sync.
  envFrom:
    - secret: openinghours-app-swagger-secret
  env:
    - name: BACKEND_URL
      value: http://openinghours
    # Kalenderen skal etter planen åpnes for publikum. Fram til da er hele appen
    # intern: alt krever innlogging, og maskeringen av interne åpningstider er
    # hvilende. Å åpne den er tre samtidige endringer:
    #   1. ingress → https://<navn>.nav.no
    #   2. sidecar.autoLogin → false
    #   3. PUBLIC_ACCESS → "true"
    - name: PUBLIC_ACCESS
      value: "false"
    # Entra ID-gruppen som gir tilgang til administrasjon. Må være den samme
    # som under `claims.groups` — uten at gruppen står begge steder blir ingen
    # admin: den ene siden ber om claimet, den andre sjekker det.
    - name: ADMIN_GROUP_ID
      value: "01a18f07-4dc7-4426-a407-09a1021dc024"
  azure:
    application:
      enabled: true
      # Alle Nav-ansatte skal kunne se kalenderen. Tilgangsstyringen for lesing
      # ligger i selve domenet: ansatt.nav.no slipper bare gjennom autentiserte
      # brukere på godkjente enheter.
      allowAllUsers: true
      tenant: nav.no
      # Å endre åpningstider er derimot begrenset til én gruppe. Kombinasjonen
      # `allowAllUsers` + `claims.groups` er Nais' anbefalte mønster når alle
      # skal slippe inn, men bare noen skal ha utvidede rettigheter: alle
      # autentiseres, og `groups`-claimet forteller appen hvem som er hvem.
      #
      # NB: kun *direkte* medlemskap teller. Er en bruker medlem via en nestet
      # gruppe, kommer ikke gruppe-ID-en med i tokenet, og hen blir ikke admin.
      claims:
        groups:
          - id: "01a18f07-4dc7-4426-a407-09a1021dc024"
    sidecar:
      # Wonderwall terminerer Entra ID-flyten før requesten når appen, så alle
      # innkommende forespørsler er innlogget. Appen har derfor ingen
      # uinnlogget tilstand å håndtere.
      enabled: true
      autoLogin: true
  accessPolicy:
    outbound:
      rules:
        - application: openinghours
  observability:
    logging:
      destinations:
        - id: loki
